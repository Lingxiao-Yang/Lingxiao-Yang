name: Update profile cards

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-cards.yml
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: top-langs
          options: username=Lingxiao-Yang&layout=compact&langs_count=6&card_width=450&theme=transparent&disable_animations=true
          path: profile/top-languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'

      - name: Generate CPU repository card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: pin
          options: username=Lingxiao-Yang&repo=cpu_project_overview&theme=transparent&disable_animations=true
          path: profile/cpu.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'

      - name: Generate excavator repository card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: pin
          options: username=Lingxiao-Yang&repo=Excavator_VLA_project_overview&theme=transparent&disable_animations=true
          path: profile/excavator.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'

      - name: Generate guitar repository card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: pin
          options: username=Lingxiao-Yang&repo=eecs373_guitar_tutor&theme=transparent&disable_animations=true
          path: profile/guitar.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'

      - name: Commit refreshed cards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile/*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh profile cards'
          git pull --rebase origin main
          git push origin HEAD:main
